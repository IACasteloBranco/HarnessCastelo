services:
  db:
    image: pgvector/pgvector:0.8.7-pg17-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: governanca
      POSTGRES_USER: governanca
      POSTGRES_PASSWORD: ${GOVERNANCA_POSTGRES_PASSWORD:?Set GOVERNANCA_POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:${GOVERNANCA_POSTGRES_PORT:-55435}:5432"
    volumes:
      - governanca_db:/var/lib/postgresql/data

volumes:
  governanca_db:
