services:
  db:
    image: pgvector/pgvector:0.8.7-pg17-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: harnesscastelo
      POSTGRES_USER: harnesscastelo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-55434}:5432"
    volumes:
      - harnesscastelo_db:/var/lib/postgresql/data

volumes:
  harnesscastelo_db:
